name: Actualizar precios

on:
  schedule:
    - cron: '*/30 7-21 * * 1-5'   # cada 30 min en horario de mercado (UTC), de lunes a viernes
    - cron: '0 9 * * 0,6'         # una vez el fin de semana (fondos publican valor con retraso)
  push:
    paths: ['data/watchlist.json', 'scripts/fetch-prices.mjs', '.github/workflows/precios.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-prices.mjs
      - name: Guardar si hay cambios
        run: |
          git config user.name "precios-bot"
          git config user.email "precios-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Precios $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
