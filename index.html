<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140E1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cimientos">
<link rel="preload" href="fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cimientos</title>
<style>
  @font-face{ font-family:'Archivo'; font-style:normal; font-display:swap; font-weight:100 900; font-stretch:62% 125%;
    src:url(archivo.woff2) format('woff2-variations'), url(archivo.woff2) format('woff2'); }
  @font-face{ font-family:'Fraunces'; font-style:normal; font-display:swap; font-weight:100 900;
    src:url(fraunces.woff2) format('woff2-variations'), url(fraunces.woff2) format('woff2'); }

  :root{
    --bg:#140E1C; --surface:#1E1629; --surface-2:#291E36; --surface-3:#372A47;
    --line:#33264A; --line-soft:#271C36;
    --ink:#F3EBDD; --muted:#AE9CBF; --faint:#76658A; --border:#33264A;
    --accent:#8FD66A; --accent-ink:#11240A; --accent-soft:rgba(143,214,106,0.13);
    --amber:#FF7A1A; --amber-ink:#2B1103; --amber-soft:rgba(255,122,26,0.14);
    --warn:#FFB547; --warn-soft:rgba(255,181,71,0.14);
    --danger:#EF4B55; --danger-soft:rgba(239,75,85,0.14);
    --invest:#B48CFF;
    --display:'Fraunces', Georgia, serif;
    --shadow:0 1px 0 rgba(255,255,255,0.03) inset, 0 8px 24px rgba(5,2,10,0.35); --shadow-lg:0 18px 40px rgba(0,0,0,0.5);
    color-scheme:dark;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ background:var(--bg); }
  body{
    margin:0; color:var(--ink);
    font-family:'Archivo', system-ui, -apple-system, sans-serif; font-stretch:96%;
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
    background-color:var(--bg);
    background-image:
      radial-gradient(420px 300px at 92% -90px, rgba(255,140,50,0.16), rgba(255,122,26,0.04) 55%, transparent 75%),
      radial-gradient(900px 420px at 50% 115%, rgba(122,70,190,0.22), transparent 70%);
    background-attachment:fixed;
  }
  #root{ position:relative; z-index:1; }
  .num{ font-variant-numeric:tabular-nums; font-feature-settings:'tnum'; }
  button, input, select, textarea{ font-family:inherit; }
  ::selection{ background:var(--amber-soft); }
  :focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  .wrap{ max-width:480px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(110px + env(safe-area-inset-bottom,0px)); }

  /* Cabecera */
  .topline{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:30px; height:30px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .brand-mark svg{ width:30px; height:30px; }
  .brand-name{ font-family:var(--display); font-weight:700; font-size:19px; line-height:1.1; }
  .sync-badge{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--faint); margin-top:2px; }
  .sync-dot{ width:6px; height:6px; border-radius:50%; background:var(--faint); flex-shrink:0; }
  .sync-dot.synced{ background:var(--accent); }
  .sync-dot.syncing{ background:var(--amber); animation:pulse 1s infinite; }
  .sync-dot.offline{ background:var(--danger); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .theme-btn, .icon-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted);
  }
  .theme-btn svg, .icon-btn svg{ width:16px; height:16px; }

  /* Navegación inferior */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));
    background:rgba(20,14,28,0.88); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
  }
  .bottom-nav-inner{ max-width:480px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr 72px 1fr; align-items:center; }
  .nav-btn{ border:none; background:none; color:var(--faint); display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; cursor:pointer; font-size:11px; font-weight:600; }
  .nav-btn svg{ width:21px; height:21px; }
  .nav-btn.active{ color:var(--ink); }
  .nav-btn.active svg{ color:var(--amber); filter:drop-shadow(0 0 6px rgba(255,122,26,0.6)); }
  .fab{
    justify-self:center; width:60px; height:60px; border-radius:50%; margin-top:-28px;
    background:radial-gradient(circle at 35% 30%, #FFA04D, #FF7A1A 55%, #E2550A); color:var(--amber-ink); border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 5px var(--bg), 0 0 26px rgba(255,122,26,0.55);
    transition:transform .15s;
  }
  .fab:active{ transform:scale(0.92); }
  .fab svg{ width:26px; height:26px; stroke-width:2.4; }

  .month-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .month-row button{ border:1px solid var(--line); background:var(--surface); border-radius:50% !important; color:var(--muted); cursor:pointer; width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
  .month-row .val{ font-family:var(--display); font-size:17px; font-weight:600; text-transform:capitalize; }

  /* Hero: luz de vela */
  .hero{
    position:relative; overflow:hidden; padding:22px 20px 18px; margin-bottom:14px; border-radius:26px;
    background:
      radial-gradient(340px 220px at 100% 0%, rgba(255,122,26,0.34), transparent 65%),
      radial-gradient(300px 200px at 0% 110%, rgba(150,80,230,0.22), transparent 70%),
      linear-gradient(165deg, #2B1E3B 0%, #1D1428 100%);
    border:1px solid rgba(255,122,26,0.20);
    box-shadow:0 18px 40px rgba(10,4,18,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
    color:var(--ink);
  }
  .hero::before{ content:''; position:absolute; top:0; left:0; width:120px; height:120px; opacity:0.10; pointer-events:none;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120' fill='none' stroke='%23F3EBDD' stroke-width='0.8'><path d='M0 0L120 120M0 0L60 120M0 0L120 60M0 0L120 15M0 0L15 120'/><path d='M0 22Q14 20 20 14Q22 6 22 0M0 46Q28 42 40 30Q46 14 46 0M0 72Q42 66 60 46Q70 22 72 0M0 98Q58 90 80 62Q96 30 98 0'/></svg>") no-repeat top left / contain; }
  .hero.over{ border-color:rgba(239,75,85,0.35);
    background: radial-gradient(340px 220px at 100% 0%, rgba(239,75,85,0.35), transparent 65%), linear-gradient(165deg, #2E1726 0%, #1D1428 100%); }
  .hero-inner{ position:relative; }
  .hero-label{ font-size:13.5px; font-weight:600; color:var(--muted); }
  .hero-huge{ font-family:var(--display); font-size:56px; font-weight:650; line-height:1; margin:8px 0 10px; letter-spacing:-0.02em; color:var(--ink); font-variant-numeric:lining-nums tabular-nums;
    text-shadow:0 0 28px rgba(255,140,50,0.25); }
  .hero.over .hero-huge{ color:#FF8A90; text-shadow:0 0 28px rgba(239,75,85,0.35); }
  .hero-sub{ font-size:13.5px; color:var(--muted); line-height:1.4; }
  .mecha{ position:relative; height:10px; border-radius:6px; background:rgba(243,235,221,0.08); margin-top:34px; }
  .mecha-fill{ height:100%; border-radius:6px; background:linear-gradient(90deg, #FFB547, #FF7A1A); box-shadow:0 0 14px rgba(255,122,26,0.55); transition:width .5s cubic-bezier(.2,.8,.2,1); }
  .mecha-fill.ok{ background:linear-gradient(90deg, #B7EC8E, #8FD66A); box-shadow:0 0 14px rgba(143,214,106,0.45); }
  .mecha-fill.over{ background:linear-gradient(90deg, #FF7A1A, #EF4B55); box-shadow:0 0 14px rgba(239,75,85,0.55); }
  .mecha-hoy{ position:absolute; top:-6px; width:2px; height:22px; border-radius:1px; background:var(--ink); transform:translateX(-1px); opacity:0.85; }
  .mecha-hoy span{ position:absolute; bottom:24px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:700; color:var(--ink); white-space:nowrap; }
  .hero-sheet{ display:flex; justify-content:space-between; margin-top:10px; font-size:12px; color:var(--muted); }

  /* Indicadores */
  .stat-row{ box-shadow:var(--shadow); display:grid; grid-template-columns:repeat(3,1fr); gap:0; margin-bottom:6px; background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .stat-mini{ padding:11px 12px; min-width:0; }
  .stat-row .stat-mini + .stat-mini{ border-left:1px solid var(--line); }
  .stat-mini .l{ font-size:12px; font-weight:600; color:var(--muted); }
  .stat-mini .v{ font-family:var(--display); font-size:19px; font-weight:650; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat-mini .h{ font-size:11px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .grid3 .stat-mini{ background:var(--surface); border:1px solid var(--line); border-radius:14px; }

  .card{ box-shadow:var(--shadow); background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; }

  .pace-card{ margin-top:12px; padding:14px 14px 8px; }
  .pace-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .pace-title{ font-size:12px; font-weight:600; color:var(--muted); }
  .pace-verdict{ font-family:var(--display); font-size:18px; font-weight:600; margin-top:1px; }
  .pace-proj{ text-align:right; flex-shrink:0; }
  .pace-proj .l{ font-size:11px; color:var(--faint); }
  .pace-proj .v{ font-size:15px; font-weight:800; }
  .pace-chart{ width:100%; height:120px; display:block; overflow:visible; }
  .pace-axis{ font-size:9.5px; fill:var(--faint); font-family:'Archivo',sans-serif; }

  /* Secciones */
  .section-label{ display:flex; justify-content:space-between; align-items:baseline; font-family:var(--display); font-size:18px; font-weight:600; color:var(--ink); margin:24px 2px 10px; }
  .section-label a{ font-size:12px; font-weight:600; cursor:pointer; color:var(--amber); }
  .lbl-num{ font-family:'Archivo',sans-serif; font-size:14px; font-weight:700; }

  /* Listas de categorías: un solo panel con separadores */
  .cat-list{ box-shadow:var(--shadow); background:var(--surface); border:1px solid var(--line); border-radius:20px; overflow:hidden; }
  .cat-row{ display:flex; align-items:center; gap:12px; padding:12px 12px 12px 14px; cursor:pointer; position:relative; transition:background .12s; }
  .cat-row + .cat-row{ border-top:1px solid var(--line-soft); }
  .cat-row:active{ background:var(--surface-2); }
  .cat-icon{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .cat-icon svg{ width:18px; height:18px; }
  .cat-icon.sm{ width:32px; height:32px; border-radius:9px; }
  .cat-icon.sm svg{ width:15px; height:15px; }
  .cat-mid{ flex:1; min-width:0; }
  .cat-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .cat-name{ font-weight:650; font-size:14.5px; }
  .cat-amt{ font-weight:750; flex-shrink:0; font-size:14px; }
  .cat-amt .of{ color:var(--faint); font-weight:500; }
  .cat-bar{ position:relative; height:6px; border-radius:4px; background:var(--surface-3); margin-top:8px; }
  .cat-bar > div{ height:100%; border-radius:4px; }
  .cat-sub{ font-size:12px; font-weight:600; margin-top:6px; color:var(--muted); }
  .pace-tick{ position:absolute; width:2px; border-radius:1px; transform:translateX(-1px); }
  .pace-tick.small{ top:-4px; height:12px; background:var(--ink); opacity:0.45; }

  .addcat-btn{ display:flex; align-items:center; justify-content:center; gap:7px; width:100%; border:1px dashed var(--line); background:none; color:var(--muted); border-radius:14px; padding:12px; font-weight:600; font-size:13px; cursor:pointer; margin-top:12px; }
  .addcat-btn svg{ width:14px; height:14px; }

  /* Fijos */
  .fixed-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .fixed-tile{ box-shadow:var(--shadow); background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:11px; cursor:pointer; min-width:0; transition:transform .12s; position:relative; overflow:hidden; }
  .fixed-tile:active{ transform:scale(0.97); }
  .fixed-tile.paid{ border-color:rgba(143,214,106,0.32); background:linear-gradient(160deg, rgba(143,214,106,0.11), var(--surface) 70%); }
  .fixed-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .fixed-edit{ border:none; background:none; color:var(--faint); padding:4px; cursor:pointer; }
  .fixed-edit svg{ width:14px; height:14px; }
  .fixed-name{ font-weight:650; font-size:14px; margin:9px 0 7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status-chip{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; padding:3px 8px; border-radius:7px; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status-chip svg{ width:12px; height:12px; stroke-width:2.8; flex-shrink:0; }
  .status-chip.ok{ background:var(--accent-soft); color:var(--accent); }
  .status-chip.part{ background:var(--amber-soft); color:var(--amber); }
  .status-chip.pend{ background:var(--surface-2); color:var(--muted); }

  /* Movimientos */
  .txn-card{ padding:4px 14px 6px; }
  .day-head{ display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:var(--faint); padding:12px 0 4px; }
  .txn-row{ display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line-soft); }
  .txn-row:last-child{ border-bottom:none; }
  .txn-mid{ flex:1; min-width:0; }
  .txn-name{ font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .txn-sub{ font-size:12px; color:var(--faint); margin-top:1px; }
  .txn-amt{ font-weight:750; flex-shrink:0; font-size:14.5px; }
  .txn-amt.income{ color:var(--accent); }
  .txn-amt.expense{ color:var(--ink); }
  .txn-del{ width:28px; height:28px; border-radius:8px; border:none; background:none; color:var(--faint); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .txn-del:active{ background:var(--surface-2); color:var(--danger); }

  .summary-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; }
  .summary-row .l{ font-size:13px; color:var(--muted); }
  .v.pos{ color:var(--accent); } .v.neg{ color:var(--danger); }

  /* Acumulado */
  .month-hist-row{ box-shadow:var(--shadow); display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px; cursor:pointer; }
  .month-hist-mid{ flex:1; min-width:0; }
  .month-hist-name{ font-family:var(--display); font-weight:600; font-size:16px; text-transform:capitalize; }
  .month-hist-sub{ font-size:12px; color:var(--faint); margin-top:1px; }
  .month-hist-bar{ height:4px; border-radius:2px; background:var(--surface-3); margin-top:7px; overflow:hidden; display:flex; }
  .month-hist-result{ font-weight:800; flex-shrink:0; text-align:right; }
  .month-hist-result.pos{ color:var(--accent); } .month-hist-result.neg{ color:var(--danger); }

  .donut-wrap{ display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  .donut-legend{ flex:1; min-width:150px; display:flex; flex-direction:column; gap:9px; }
  .donut-legend-row{ display:flex; align-items:center; gap:8px; font-size:13px; }
  .donut-legend-row .sw{ width:9px; height:9px; border-radius:3px; flex-shrink:0; }
  .donut-legend-row .name{ flex:1; font-weight:600; }
  .muted{ color:var(--muted); }

  /* Hojas modales */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(4,8,14,0.66); display:flex; align-items:flex-end; justify-content:center; z-index:60; animation:fadeIn .18s ease-out; }
  .modal{ background:linear-gradient(180deg, #241A31, var(--surface) 140px); border-radius:28px 28px 0 0; padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px)); width:100%; max-width:480px; border:1px solid var(--line); border-bottom:none; max-height:92vh; overflow-y:auto; animation:sheetUp .24s cubic-bezier(.2,.8,.2,1); }
  .modal::before{ content:''; display:block; width:38px; height:4px; border-radius:2px; background:var(--surface-3); margin:0 auto 12px; }
  @keyframes sheetUp{ from{ transform:translateY(40px); opacity:0.4; } to{ transform:none; opacity:1; } }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-head h3{ margin:0; font-family:var(--display); font-size:21px; font-weight:600; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:6px; }
  .field input, .field select{ width:100%; padding:11px 12px; border-radius:11px; border:1px solid var(--line); background:var(--bg); color:var(--ink); outline:none; font-size:15px; }
  .field input:focus{ border-color:var(--amber); }
  .btn{ display:flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:14px; border-radius:13px; border:none; font-weight:750; font-size:15px; cursor:pointer; }
  .btn-primary{ background:linear-gradient(180deg, #FF8C33, #FF7A1A); color:var(--amber-ink); box-shadow:0 8px 22px rgba(255,122,26,0.30); }
  .btn-primary:disabled{ opacity:0.35; }
  .btn-ghost{ background:var(--surface-2); color:var(--ink); margin-top:8px; }
  .swatches{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .swatch{ width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .swatch.active{ border-color:var(--ink); }
  .icon-swatch{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; }

  .type-toggle{ display:flex; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:3px; gap:3px; margin-bottom:6px; }
  .type-toggle button{ flex:1; border:none; background:none; padding:8px 0; border-radius:9px; font-weight:700; font-size:13.5px; cursor:pointer; color:var(--muted); display:flex; align-items:center; justify-content:center; gap:6px; }
  .type-toggle button svg{ width:15px; height:15px; }
  .type-toggle button.active.expense{ background:var(--surface-2); color:var(--ink); }
  .type-toggle button.active.income{ background:var(--accent-soft); color:var(--accent); }

  .chip-row{ display:flex; gap:7px; flex-wrap:wrap; }
  .chip{ display:flex; align-items:center; gap:6px; padding:8px 11px; border-radius:10px; border:1px solid var(--line); background:var(--bg); font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; }
  .chip svg{ width:14px; height:14px; }
  .chip.active{ border-color:var(--chip-color, var(--amber)); background:color-mix(in srgb, var(--chip-color, var(--amber)) 16%, transparent); color:var(--ink); }
  .chip.active svg{ color:var(--chip-color, var(--amber)); }

  /* Apuntar rápido */
  .qa-amount{ text-align:center; padding:14px 0 10px; }
  .qa-amount .v{ font-family:var(--display); font-size:58px; font-weight:600; line-height:1; letter-spacing:-0.02em; font-variant-numeric:lining-nums; }
  .qa-amount .v.empty{ color:var(--faint); }
  .qa-amount .cur{ font-size:30px; margin-left:4px; color:var(--muted); font-weight:700; }
  .qa-amount .hint{ font-size:12px; color:var(--faint); margin-top:6px; min-height:16px; }
  .qa-cats{ display:flex; gap:7px; overflow-x:auto; padding:4px 0 12px; margin:0 -18px; padding-left:18px; padding-right:18px; scrollbar-width:none; }
  .qa-cats::-webkit-scrollbar{ display:none; }
  .qa-cats .chip{ flex-shrink:0; }
  .qa-meta{ display:flex; gap:8px; margin-bottom:12px; }
  .qa-meta input{ flex:1; min-width:0; padding:10px 12px; border-radius:11px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:14px; outline:none; }
  .qa-meta input:focus{ border-color:var(--amber); }
  .qa-date{ position:relative; flex-shrink:0; display:flex; align-items:center; gap:6px; padding:0 12px; border-radius:11px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:13.5px; font-weight:600; }

  .key{ height:56px; border-radius:18px; border:none; background:var(--surface-2); color:var(--ink); font-family:var(--display); font-size:25px; font-weight:550; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .08s, transform .08s; user-select:none; -webkit-user-select:none; }

  .key svg{ width:22px; height:22px; }

  .plan-input{ display:flex; align-items:baseline; gap:3px; flex-shrink:0; padding:6px 10px; border-radius:9px; background:var(--bg); border:1px solid var(--line); }

  .plan-input span{ color:var(--faint); font-size:13px; }
